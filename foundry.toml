[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
bytecode_hash = "none"
fs_permissions = [
  { access = "read", path = "./config.json" },
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "./out" },
  { access = "read-write", path = "./.e2e" }
]

[lint]
# Lock expiry and reward streaming are inherently time based; a few seconds of validator skew is harmless here.
exclude_lints = ["block-timestamp"]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 100
fail_on_revert = false

[profile.ci.fuzz]
runs = 5000

[profile.ci.invariant]
runs = 512
depth = 150

[rpc_endpoints]
# filled from the environment by scripts/deploy.mjs so the url (often containing an api key) stays off the command line
deploy = "${DM_DEPLOY_RPC}"
